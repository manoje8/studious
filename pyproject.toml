[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medici"
description = "Agentic Retrieval-Augmented Generation library"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name="Mano Deepan", email="manodeepan2001@gmail.com"}
]
keywords = ["rag", "ai", "agents", "retrieval-augmented-generation", "langchain", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv",
    "requests",
    "pytz",
    "pyyaml",
    "tenacity",
    "loguru",
    "rank-bm25",
    "nest-asyncio",
    "ascii-colors",

    # LLM
    "openai",
    "google-genai",
    "langchain",
    "langgraph",
    "langchain-text-splitters",

    # Vector DB
    "qdrant-client[fastembed]",
    "flashrank",

    # Databases
    "redis",
    "redisvl",
    "sqlalchemy",
    "pg8000",
    "psycopg[binary]",
    "psycopg-pool",
    "asyncpg",

    # Embeddings & NLP
    "sentence-transformers",
    "nltk",
    "transformers",
    "torch",

    # Parsing (basic)
    "pypdf",
    "beautifulsoup4",

    # Auth
    "bcrypt",
    "pyjwt",

    # Internal
    "treant @ git+https://github.com/manoje8/treant.git",
]

[project.optional-dependencies]

api = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

ui = ["streamlit"]

gcp = [
    "google-cloud-storage",
    "google-cloud-aiplatform",
    "google-cloud-discoveryengine",
    "google-cloud-documentai",
    "cloud-sql-python-connector",
    "langchain-google-vertexai",
]

groq = ["langchain-groq"]
cerebras = ["cerebras-cloud-sdk"]

docling = ["docling"]
documents = ["python-pptx", "python-docx", "unstructured", "trafilatura"]

graph = [
    "langgraph-checkpoint-postgres",
    "langchain-community",
    "langchain-openai",
]

observability = [
    "langsmith",
    "logfire[fastapi,requests]",
]

dev = ["ruff", "black", "pre-commit"]
test = ["pytest", "pytest-asyncio"]

all = [
    "medici[api,ui,gcp,groq,cerebras,docling,documents,graph,observability]",
]

[project.urls]
Homepage = "https://github.com/manoje8/medici"
Repository = "https://github.com/manoje8/medici"
Issues = "https://github.com/manoje8/medici/issues"

[project.scripts]
medici = "medici.ingestion.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E402",
    "E501",
    "B008",
    "UP046"
]

[tool.ruff.lint.isort]
known-first-party = ["medici"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (may require external services)",
    "eval: marks tests as evaluation tests (requires live LLM and Qdrant)",
]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"

[tool.logfire]
ignore_no_config = true


[tool.setuptools.packages.find]
where = ["."]
include = ["medici*"]


[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.sql", "*.env.example"]
