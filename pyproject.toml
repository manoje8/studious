[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Medici"
description = "Agentic Retrieval-Augmented Generation"
version = "0.0.2"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name="Mano Deepan", email="manodeepan2001@gmail.com"}
]
keywords = ["fastapi", "rag", "ai"]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "python-dotenv",
    "requests",
    "pytz",
    "nest-asyncio",
    "streamlit",
    "rank-bm25",

    "openai",
    "google-genai",
    "cerebras-cloud-sdk",

    "google-cloud-storage",
    "google-cloud-aiplatform",
    "google-cloud-discoveryengine",
    "google-cloud-documentai",
    "cloud-sql-python-connector",

    "qdrant-client[fastembed]",
    "flashrank",
    "redis",
    "redisvl",
    "sqlalchemy",
    "pg8000",
    "psycopg[binary]",
    "psycopg-pool",
    "asyncpg",

    "langchain",
    "langgraph",
    "langchain-text-splitters",
    "langgraph-checkpoint-postgres",
    "langchain-google-vertexai",
    "langchain-groq",
    "langchain-community",
    "langchain-openai",
    "pydantic>=2.0.0",

    "unstructured",
    "python-pptx",
    "python-docx",
    "pypdf",
    "beautifulsoup4",
    "docling",
    "trafilatura",

    "langsmith",
    "logfire[fastapi,requests]",
    "loguru",

    "ascii-colors",
    "pyyaml",
    "tenacity",
    "bcrypt",
    "pyjwt",

    "sentence-transformers",
    "nltk",
    "transformers",
    "torch",

    "treant @ git+https://github.com/manoje8/treant.git",
]

[project.optional-dependencies]
dev = ["ruff", "black", "pre-commit"]
test = ["pytest", "pytest-asyncio"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E402",
    "E501",
    "B008",
    "UP046"
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (may require external services)",
    "eval: marks tests as evaluation tests (requires live LLM and Qdrant)",
]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"

[tool.logfire]
ignore_no_config = true


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]


[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.env.example"]
